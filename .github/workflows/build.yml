name: C11 Core/Web and ST7789 integration tests
on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install web dependencies
        run: sudo apt-get update && sudo apt-get install -y libcivetweb-dev libjson-c-dev libsqlite3-dev libdbus-1-dev pkg-config curl
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --parallel 2
      - name: Unit tests
        run: ctest --test-dir build --output-on-failure
      - name: ST7789 Bjorni and screen statuses
        run: python3 platform/display/screensaver/test-screensaver.py
