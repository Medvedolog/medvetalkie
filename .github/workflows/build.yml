name: C11 Core/Web and ST7789 integration tests
on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install web dependencies
        run: sudo apt-get update && sudo apt-get install -y libcivetweb-dev libjson-c-dev libsqlite3-dev libdbus-1-dev pkg-config curl
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --parallel 2
      - name: Unit tests
        run: ctest --test-dir build --output-on-failure
      - name: ST7789 Bjorni and screen statuses
        run: python3 platform/display/screensaver/test-screensaver.py
      - name: Live ST7789 headset telemetry safety tests
        run: python3 -m py_compile platform/display/live-status.py && python3 tests/test_display_live_status.py

      - name: Optional ST7789 v2 wrapper syntax
        run: bash -n platform/display/status-v2.sh

      - name: Optional ST7789 v2 status screen preview
        run: python3 tests/test_display_status_v2.py

      - name: In-place installer simulated filesystem and mixed-proxy validation
        run: python3 tests/test_deploy_installer.py

      - name: Bluetooth SSH TUI offline tests
        run: python3 -m py_compile platform/bluetooth/medvetalkie-bt-tui.py platform/bluetooth/medvetalkie-bt-menu.py platform/bluetooth/bt_audio_bench.py platform/bluetooth/bluez_cli.py && python3 tests/test_bt_tui.py && python3 tests/test_bt_menu.py && python3 tests/test_bluez_cli.py

      - name: Headless intercom offline safety and routing tests
        run: python3 -m py_compile platform/bluetooth/medvetalkie-intercom-test.py && python3 tests/test_bt_intercom.py

      - name: Cross-headset PCM isolation checks
        run: python3 -m py_compile platform/bluetooth/cross_pcm_isolation.py && python3 tests/test_cross_pcm_isolation.py

      - name: Measured Bluetooth PCM relay offline tests
        run: python3 -m py_compile platform/bluetooth/medvetalkie-pcm-relay.py && python3 tests/test_bt_pcm_relay.py

      - name: Native PipeWire loopback scope and CLI tests
        run: python3 -m py_compile platform/bluetooth/medvetalkie-native-loopback.py && python3 tests/test_bt_native_loopback.py
